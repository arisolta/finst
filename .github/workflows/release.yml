name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Multi-Platform Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Multi-Platform Release Archives
        run: |
          sudo apt-get update -y && sudo apt-get install -y zip
          mkdir -p dist
          
          echo "Building darwin/arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/finst ./cmd/finst
          (cd dist && tar -czf finst_darwin_arm64.tar.gz finst && rm finst)
          
          echo "Building darwin/amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/finst ./cmd/finst
          (cd dist && tar -czf finst_darwin_amd64.tar.gz finst && rm finst)
          
          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/finst ./cmd/finst
          (cd dist && tar -czf finst_linux_amd64.tar.gz finst && rm finst)
          
          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/finst ./cmd/finst
          (cd dist && tar -czf finst_linux_arm64.tar.gz finst && rm finst)
          
          echo "Building windows/amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/finst.exe ./cmd/finst
          (cd dist && zip finst_windows_amd64.zip finst.exe && rm finst.exe)
          
          echo "Generating Checksums..."
          (cd dist && sha256sum finst_* > checksums.txt && cat checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/finst_darwin_arm64.tar.gz
            dist/finst_darwin_amd64.tar.gz
            dist/finst_linux_amd64.tar.gz
            dist/finst_linux_arm64.tar.gz
            dist/finst_windows_amd64.zip
            dist/checksums.txt
          make_latest: "true"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
